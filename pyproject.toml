[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-tools"
version = "0.1.0"
description = "Various journal and document utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4.0.0",
]

[project.scripts]
journal = "cli:main"
merge-pdfs = "journal.pdf.merge_pdfs:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["journal*"]
